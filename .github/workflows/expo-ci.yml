name: Expo CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check Expo project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required project files
        run: |
          test -f App.js
          test -f package.json
          test -f .gitignore

      - name: Check Expo package versions
        run: npx expo install --check

      - name: Validate project source files
        run: |
          node --check components/ProductCard.js
          node -e "const fs=require('fs'); const src=fs.readFileSync('App.js','utf8'); if(src.includes('CI_BREAK_MARKER')){ console.error('Failed step: Validate project source files'); console.error('CI_BREAK_MARKER found in App.js — remove the marker to fix the pipeline.'); process.exit(1);} if(!src.includes('22i-8787') || !src.includes('Fizza Ali')){ console.error('Student name/roll missing from App.js'); process.exit(1);} console.log('App.js validation passed');"
